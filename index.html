<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BellaFlor — Loja configurável</title>
<meta name="description" content="Loja controlada por config.json — fallback seguro caso o JSON não carregue." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">

<!-- Fonts & icons -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Pinyon+Script&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* ---------- Variáveis padrão (serão sobrescritas pelo config.json se existir) ---------- */
  :root{
    --brand-primary: #bf6c74;
    --brand-accent:  #d4a373;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --bg: #fcfcfb;
    --surface: #ffffff;
    --radius: 10px;
    --shadow: 0 12px 36px rgba(0,0,0,0.08);
    --max-width: 1200px;

    --ff-heading: "Cinzel", serif;
    --ff-script: "Pinyon Script", cursive;
    --ff-body: "Lato", sans-serif;
  }

  /* ---------- Reset e base ---------- */
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--ff-body);
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.45;
    opacity:0;
    transition:opacity .35s ease;
  }
  body.ready{opacity:1}

  .container{max-width:var(--max-width);margin:0 auto;padding:0 20px}

  /* Loader */
  .page-loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:12px;background:linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.94));z-index:9999;
  }
  .petal{font-size:2.4rem;color:var(--brand-accent);animation:breathe 1.8s infinite}
  @keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.05)}}

  /* Header */
  header.site-header{position:sticky;top:0;background:rgba(255,255,255,0.94);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,0.03);z-index:900}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
  .brand{cursor:pointer;display:flex;flex-direction:column}
  .brand .name{font-family:var(--ff-heading);color:var(--brand-primary);margin:0}
  .brand .sub{font-family:var(--ff-script);color:var(--brand-accent);margin-top:-6px;font-size:.95rem}
  nav.main-nav{display:flex;gap:12px;align-items:center}
  .nav-link{background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:700;text-decoration:none}
  .nav-link.active{color:var(--brand-primary);border-bottom:2px solid var(--brand-primary)}

  /* Hero */
  .hero{min-height:62vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 18px;border-bottom:1px solid rgba(0,0,0,0.03);color:white;background-size:cover;background-position:center}
  .hero .lead{font-family:var(--ff-heading);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;color:rgba(255,255,255,0.95)}
  .hero h1{font-family:var(--ff-script);font-size:clamp(2rem,5vw,3.6rem);margin:0.2rem 0;text-shadow:0 10px 30px rgba(0,0,0,0.28)}
  .hero p.subtitle{max-width:840px;margin:12px auto 20px;color:rgba(255,255,255,0.92);font-family:var(--ff-heading)}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{padding:12px 20px;border-radius:10px;border:0;cursor:pointer;font-weight:700;transition:transform .18s ease}
  .btn.primary{background:var(--brand-primary);color:#fff}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.18)}

  /* Sections */
  .site-section{padding:48px 0}
  .section-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .section-title{font-family:var(--ff-heading);font-size:1.1rem;margin:0}
  .section-sub{color:var(--muted);font-size:.95rem}

  /* Grid & cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:20px}
  .card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s}
  .card:hover{transform:translateY(-6px)}
  .card .media{height:220px;background:#f4f4f4;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card .card-body{padding:14px}
  .tag{font-size:.72rem;color:var(--brand-accent);text-transform:uppercase;letter-spacing:1.6px}
  .card h3{font-family:var(--ff-heading);margin:6px 0 8px}
  .price{color:var(--muted);font-weight:700}

  /* Cart */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.48);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:120}
  .overlay.show{opacity:1;pointer-events:all}
  .cart{position:fixed;right:0;top:0;height:100vh;width:420px;max-width:96%;background:var(--surface);transform:translateX(110%);transition:transform .24s ease;z-index:130;display:flex;flex-direction:column}
  .cart.open{transform:translateX(0)}
  .cart .head{padding:18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
  .cart .body{padding:18px;overflow:auto;flex:1}
  .cart .foot{padding:18px;border-top:1px solid #eee}

  /* Modal */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:140}
  .modal.show{opacity:1;pointer-events:all}
  .modal-card{background:var(--surface);border-radius:12px;overflow:hidden;max-width:980px;width:100%;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}
  @media (max-width:820px){ .modal-card{grid-template-columns:1fr} }

  /* Footer */
  footer.site-footer{background:#fafafa;padding:40px 0;border-top:1px solid rgba(0,0,0,0.03)}
  .footer-inner{display:flex;flex-direction:column;align-items:center;gap:12px}

  /* Accessibility helper */
  .sr-only{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}

  @media (max-width:900px){
    .card .media{height:180px}
    .hero{padding:36px 12px}
  }
</style>
</head>
<body>
  <!-- Loader -->
  <div id="page-loader" class="page-loader" aria-hidden="false">
    <div class="petal" aria-hidden="true"><i class="fas fa-seedling" aria-hidden="true"></i></div>
    <div class="muted" style="font-family:var(--ff-heading);letter-spacing:2px">CULTIVANDO BELEZA...</div>
  </div>

  <!-- Header -->
  <header class="site-header" role="banner" aria-label="Cabeçalho">
    <div class="container nav-inner">
      <div id="brand" class="brand" role="button" tabindex="0">
        <div class="name" id="brandName">BellaFlor</div>
        <div class="sub" id="brandSub">Atelier Botânico</div>
      </div>
      <nav id="mainNav" class="main-nav" role="navigation" aria-label="Menu principal">
        <!-- preenchido por config -->
      </nav>
    </div>
  </header>

  <!-- Main / Hero -->
  <main id="main" role="main">
    <section id="hero" class="hero" role="region" aria-label="Destaque">
      <div class="container">
        <div class="lead" id="heroLead">A Poesia das Flores</div>
        <h1 id="heroTitle">BellaFlor</h1>
        <p class="subtitle" id="heroSubtitle">Arranjos autorais que traduzem sentimentos.</p>
        <div class="cta" id="heroCta"></div>
      </div>
    </section>

    <!-- Dynamic sections -->
    <div id="sectionsRoot" class="container"></div>
  </main>

  <!-- Overlay & Cart -->
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <aside id="cartPanel" class="cart" aria-hidden="true" role="dialog" aria-label="Carrinho">
    <div class="head">
      <strong id="cartTitle">Seu Jardim</strong>
      <button id="btnCloseCart" class="icon-button" aria-label="Fechar carrinho"><i class="fas fa-times" aria-hidden="true"></i></button>
    </div>
    <div class="body" id="cartBody">
      <p id="cartEmpty" class="sr-only">Sua cesta de flores está vazia no momento.</p>
    </div>
    <div class="foot">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="muted" id="subtotalLabel">Subtotal</div>
        <div id="subtotalValue">R$ 0,00</div>
      </div>
      <a id="checkoutLink" class="btn primary" href="#" target="_blank" rel="noopener noreferrer">Finalizar no WhatsApp <i class="fab fa-whatsapp" style="margin-left:8px" aria-hidden="true"></i></a>
    </div>
  </aside>

  <!-- Product Modal -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-label="Detalhes do produto">
    <div class="modal-card" role="document">
      <div id="modalImage" style="background-size:cover;background-position:center;min-height:300px"></div>
      <div style="padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div id="modalCategory" class="muted">Categoria</div>
          <button id="modalClose" class="icon-button" aria-label="Fechar"><i class="fas fa-times" aria-hidden="true"></i></button>
        </div>
        <h3 id="modalTitle"></h3>
        <div id="modalPrice" style="color:var(--brand-primary);font-size:1.2rem"></div>
        <p id="modalDesc" class="muted"></p>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button id="modalAdd" class="btn primary" style="flex:1">Adicionar à Cesta</button>
          <button id="modalWish" class="btn ghost" title="Salvar"><i class="far fa-heart" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner container">
      <div style="text-align:center">
        <div id="footerBrand" style="font-family:var(--ff-heading);font-weight:700;color:var(--brand-primary)">BellaFlor</div>
        <div id="footerMade" class="muted">Design Exclusivo</div>
      </div>
      <div id="footerSocial" style="display:flex;gap:12px;align-items:center"></div>
      <div class="muted">© <span id="footerYear"></span></div>
    </div>
  </footer>

<script>
/*
  Versão robusta e tolerante: carrega config.json se disponível, mas sempre
  renderiza UI com DEFAULT_CONFIG como fallback.
  -> Corrige o problema de "página em branco": em quaisquer erros o conteúdo
     padrão aparece e o loader é removido.
*/

(function(){
  'use strict';

  /* ---------- Helpers ---------- */
  const $ = (s, ctx = document) => ctx.querySelector(s);
  const $$ = (s, ctx = document) => Array.from(ctx.querySelectorAll(s));
  const escapeHTML = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const formatMoney = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

  function mergeDeep(a,b){
    const out = JSON.parse(JSON.stringify(a));
    for(const k in b){
      if(b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])){
        out[k] = mergeDeep(out[k]||{}, b[k]);
      } else out[k] = b[k];
    }
    return out;
  }

  /* ---------- DEFAULT CONFIG seguro ---------- */
  const DEFAULT = {
    meta: { version: "1.0" },
    store: {
      info: { name: "BellaFlor", subtitle: "Atelier Botânico", whatsapp_number: "551938279999" },
      links: { instagram: "#", email: "mailto:contato@bellaflor.com.br" }
    },
    theme: {
      colors: { primary:"#bf6c74", accent:"#d4a373", text:"#2c3e50", muted:"#7f8c8d", bg:"#fcfcfb", surface:"#ffffff" },
      fonts: { heading:"'Cinzel', serif", script:"'Pinyon Script', cursive", body:"'Lato', sans-serif" }
    },
    texts: {
      hero: {
        lead: "A Poesia das Flores",
        title: "BellaFlor",
        subtitle: "Arranjos autorais que traduzem sentimentos.",
        ctas: [{ type:"scroll", label:"Ver Coleção", target:"#products" }, { type:"link", label:"WhatsApp", href:"https://wa.me/551938279999" }],
        background: "https://images.unsplash.com/photo-1563241527-300027f88ea2?auto=format&fit=crop&w=1600&q=80"
      }
    },
    catalog: {
      categories: ["Todos","Buquês","Arranjos","Box Luxo","Orquídeas","Secas & Preservadas"],
      mock: { count: 12, basePrice: 120 }
    },
    sections: [
      { id:"products", type:"products", title:"Coleção", subtitle:"Nossos arranjos", data:{limit:12} }
    ],
    footer: { made_by: "Design Exclusivo", social: [{icon:"instagram",href:"#"},{icon:"whatsapp",href:"https://wa.me/551938279999"}] }
  };

  /* ---------- Estado ---------- */
  let CONFIG = DEFAULT;
  let PRODUCTS = [];
  let ACTIVE_CATEGORY = null;
  let CART = JSON.parse(localStorage.getItem('bf_cart')||'[]');
  let WISHLIST = JSON.parse(localStorage.getItem('bf_wish')||'[]');
  let CURRENT_PRODUCT = null;

  /* ---------- Theme application ---------- */
  function applyTheme(){
    try{
      const t = CONFIG.theme || {};
      if(t.colors) {
        for(const key in t.colors) {
          const varName = '--' + (key==='primary' ? 'brand-primary' : key);
          document.documentElement.style.setProperty(varName, t.colors[key]);
        }
      }
      if(t.fonts) {
        if(t.fonts.body) document.body.style.fontFamily = t.fonts.body;
      }
    }catch(e){ console.warn('applyTheme error', e); }
  }

  /* ---------- Load config.json (non-blocking) ---------- */
  async function loadConfig(){
    try {
      if(location.protocol === 'file:') { CONFIG = DEFAULT; return; }
      const resp = await fetch('config.json', {cache:'no-store'});
      if(!resp.ok){ CONFIG = DEFAULT; return; }
      const json = await resp.json();
      CONFIG = mergeDeep(DEFAULT, json || {});
    } catch(e) {
      console.warn('Não foi possível carregar config.json — fallback para DEFAULT.', e && e.message);
      CONFIG = DEFAULT;
    }
  }

  /* ---------- Mock products generator ---------- */
  function generateMocks(count=12, base=120){
    const flowers = [
      {name:'Rosas Colombianas',key:'rosa',mod:1.5},
      {name:'Hortênsias Azuis',key:'hydrangea',mod:1.2},
      {name:'Orquídea Phalaenopsis',key:'orchid',mod:2.0},
      {name:'Girassóis Vibrantes',key:'sunflower',mod:0.9},
      {name:'Tulipas Holandesas',key:'tulip',mod:1.8},
      {name:'Mix do Campo',key:'wildflower',mod:0.8}
    ];
    const adjectives = ['Imperial','Aurora','Romance','Serenidade','Majestade','Poesia','Vintage'];
    const containers = ['em Vaso','no Kraft','na Box Aveludada','Rústico','Hand-tied'];
    const images = [
      'https://images.unsplash.com/photo-1562690868-60bbe7293e94?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1470509037663-253afd7f0f51?auto=format&fit=crop&w=900&q=80'
    ];
    return Array.from({length:count}, (_,i) => {
      const f = flowers[i % flowers.length];
      const adj = adjectives[i % adjectives.length];
      const cont = containers[i % containers.length];
      const price = (base * f.mod + Math.random()*30).toFixed(2);
      return {
        id: `prod_${i+1}`,
        name: `${f.name} ${adj}`,
        subtitle: `${cont} • Design Exclusivo`,
        category: (cont.includes('Kraft')||cont.includes('Hand-tied')) ? 'Buquês' : 'Arranjos',
        price: price,
        image: images[i % images.length],
        description: `Composição com ${f.name}. Cartão e cuidados inclusos.`
      };
    });
  }

  /* ---------- Renderers ---------- */
  function renderNav(){
    const nav = $('#mainNav');
    nav.innerHTML = '';
    const items = CONFIG.nav || [{label:'Home', href:'#hero'}];
    items.forEach(it => {
      const a = document.createElement('a');
      a.className = 'nav-link';
      a.href = it.href || '#';
      a.textContent = it.label || 'Item';
      if(it.target) a.target = it.target;
      nav.appendChild(a);
    });
  }

  function renderHero(){
    const h = CONFIG.texts && CONFIG.texts.hero ? CONFIG.texts.hero : DEFAULT.texts.hero;
    const hero = $('#hero');
    hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,.22), rgba(0,0,0,.08)), url('${h.background || DEFAULT.texts.hero.background}')`;
    $('#heroLead').textContent = h.lead || '';
    $('#heroTitle').textContent = h.title || '';
    $('#heroSubtitle').textContent = h.subtitle || '';

    const ctaRoot = $('#heroCta');
    ctaRoot.innerHTML = '';
    (h.ctas || []).forEach(cta => {
      const el = document.createElement(cta.type === 'link' ? 'a' : 'button');
      el.className = 'btn ' + (cta.style === 'ghost' ? 'ghost' : 'primary');
      el.textContent = cta.label || 'Ação';
      if(cta.type === 'link'){ el.href = cta.href || '#'; el.target = '_blank'; el.rel = 'noopener noreferrer'; }
      else if(cta.type === 'scroll'){ el.addEventListener('click', ()=>{ const target = document.querySelector(cta.target || '#sectionsRoot'); if(target) target.scrollIntoView({behavior:'smooth'}); }); }
      else if(cta.type === 'action' && cta.action === 'openCart'){ el.addEventListener('click', openCart); }
      ctaRoot.appendChild(el);
    });
  }

  function createProductCard(p){
    const c = document.createElement('article');
    c.className = 'card';
    c.innerHTML = `
      <div class="media"><img src="${escapeHTML(p.image||'')}" alt="${escapeHTML(p.name||'')}" loading="lazy" onerror="this.src='https://via.placeholder.com/900x600?text=Imagem'"></div>
      <div class="card-body">
        <div class="tag">${escapeHTML(p.category||'')}</div>
        <h3>${escapeHTML(p.name||'Produto')}</h3>
        <div class="price">${formatMoney(p.price)}</div>
      </div>
    `;
    const media = c.querySelector('.media');
    media.style.cursor = 'pointer';
    media.addEventListener('click', ()=> openProductModal(p));
    return c;
  }

  function renderSections(){
    const root = $('#sectionsRoot');
    root.innerHTML = '';
    const sections = CONFIG.sections || [];
    sections.forEach(sec => {
      const secEl = document.createElement('section');
      secEl.className = 'site-section';
      const header = document.createElement('div');
      header.className = 'section-header';
      const left = document.createElement('div');
      left.innerHTML = `<h3 class="section-title">${escapeHTML(sec.title||'')}</h3><div class="section-sub">${escapeHTML(sec.subtitle||'')}</div>`;
      header.appendChild(left);
      secEl.appendChild(header);

      // supported types: products, grid, text, gallery
      if(sec.type === 'products'){
        const grid = document.createElement('div');
        grid.id = sec.id || 'products';
        grid.className = 'grid';
        let items = PRODUCTS.slice();
        if(sec.data && sec.data.category && sec.data.category !== 'Todos') items = items.filter(p => p.category === sec.data.category);
        if(sec.data && sec.data.limit) items = items.slice(0, sec.data.limit);
        items.forEach(p => grid.appendChild(createProductCard(p)));
        secEl.appendChild(grid);
      } else if(sec.type === 'grid'){
        const grid = document.createElement('div'); grid.className = 'grid';
        (sec.items||[]).forEach(item => {
          const card = document.createElement('article'); card.className='card';
          card.innerHTML = `<div class="media" style="background-image:url('${(item.image||'')}');background-size:cover;height:160px"></div><div class="card-body"><h3>${escapeHTML(item.title||'')}</h3><div class="price">${escapeHTML(item.subtitle||'')}</div></div>`;
          grid.appendChild(card);
        });
        secEl.appendChild(grid);
      } else if(sec.type === 'text'){
        const p = document.createElement('div'); p.innerHTML = sec.html || `<p>${escapeHTML(sec.text||'')}</p>`;
        secEl.appendChild(p);
      } else if(sec.type === 'gallery'){
        const grid = document.createElement('div'); grid.className='grid';
        (sec.images||[]).forEach(src => {
          const c = document.createElement('div'); c.className='card'; c.innerHTML=`<div class="media"><img src="${src}" alt=""></div>`;
          grid.appendChild(c);
        });
        secEl.appendChild(grid);
      } else {
        // fallback text
        const p = document.createElement('div'); p.innerHTML = `<p>${escapeHTML(sec.text||'')}</p>`; secEl.appendChild(p);
      }

      root.appendChild(secEl);
    });
  }

  /* ---------- Modal + Cart ---------- */
  function openProductModal(product){
    CURRENT_PRODUCT = product;
    const img = $('#modalImage'); if(img) img.style.backgroundImage = `url('${product.image}')`;
    $('#modalCategory').textContent = product.category || '';
    $('#modalTitle').textContent = product.name || '';
    $('#modalPrice').textContent = formatMoney(product.price || 0);
    $('#modalDesc').textContent = product.description || '';
    $('#modal').classList.add('show'); $('#modal').setAttribute('aria-hidden','false');
  }
  function closeProductModal(){ CURRENT_PRODUCT = null; $('#modal').classList.remove('show'); $('#modal').setAttribute('aria-hidden','true'); }

  function persistCart(){ try{ localStorage.setItem('bf_cart', JSON.stringify(CART)); }catch(e){} }
  function persistWish(){ try{ localStorage.setItem('bf_wish', JSON.stringify(WISHLIST)); }catch(e){} }

  function addToCart(product){
    CART.push(product);
    persistCart();
    renderCart();
    openCart();
  }

  function renderCart(){
    const body = $('#cartBody'); body.innerHTML = '';
    if(!CART.length){ $('#cartEmpty').classList.remove('sr-only'); } else { $('#cartEmpty').classList.add('sr-only'); }
    CART.forEach((it, idx) => {
      const row = document.createElement('div'); row.style.display='flex'; row.style.gap='12px'; row.style.marginBottom='12px'; row.style.alignItems='center';
      row.innerHTML = `<img src="${escapeHTML(it.image||'')}" style="width:64px;height:64px;object-fit:cover;border-radius:6px" onerror="this.src='https://via.placeholder.com/80x80?text=Img'"><div style="flex:1"><div style="font-weight:700">${escapeHTML(it.name)}</div><div style="color:var(--brand-primary);font-weight:700">${formatMoney(it.price)}</div></div><button class="icon-button" aria-label="Remover"><i class="far fa-trash-alt"></i></button>`;
      row.querySelector('button').addEventListener('click', ()=>{ CART.splice(idx,1); persistCart(); renderCart(); });
      body.appendChild(row);
    });
    const total = CART.reduce((s,i)=>s+Number(i.price||0),0); $('#subtotalValue').textContent = formatMoney(total);
    $('#checkoutLink').href = buildWhatsAppCheckout();
    updateCartCount();
  }

  function updateCartCount(){
    const el = document.getElementById('cartCount');
    if(!el) return;
    el.textContent = CART.length;
    el.classList.toggle('sr-only', CART.length===0);
  }

  function openCart(){ $('#cartPanel').classList.add('open'); $('#overlay').classList.add('show'); $('#cartPanel').setAttribute('aria-hidden','false'); }
  function closeCart(){ $('#cartPanel').classList.remove('open'); $('#overlay').classList.remove('show'); $('#cartPanel').setAttribute('aria-hidden','true'); }

  function toggleWish(product){
    const idx = WISHLIST.findIndex(w=>w.id===product.id);
    if(idx === -1) WISHLIST.push(product); else WISHLIST.splice(idx,1);
    persistWish();
  }

  function buildWhatsAppCheckout(){
    const num = (CONFIG.store && CONFIG.store.info && CONFIG.store.info.whatsapp_number) ? CONFIG.store.info.whatsapp_number : '';
    let msg = `Olá, vim pelo site da *${CONFIG.store.info.name || 'BellaFlor'}*.%0A%0A`;
    if(!CART.length) msg += 'Ainda não selecionei produtos.%0A'; else { CART.forEach(i=> msg += `• ${i.name} - ${formatMoney(i.price)}%0A`); msg += `%0A*Total: ${formatMoney(CART.reduce((s,i)=>s+Number(i.price||0),0))}*%0A`; }
    return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  }

  /* ---------- Footer ---------- */
  function renderFooter(){
    $('#footerYear').textContent = (new Date()).getFullYear();
    $('#footerBrand').textContent = CONFIG.store.info.name || DEFAULT.store.info.name;
    $('#footerMade').textContent = CONFIG.footer && CONFIG.footer.made_by ? CONFIG.footer.made_by : DEFAULT.footer.made_by;
    const root = $('#footerSocial'); root.innerHTML = '';
    (CONFIG.footer && Array.isArray(CONFIG.footer.social) ? CONFIG.footer.social : DEFAULT.footer.social).forEach(s=>{
      const a = document.createElement('a'); a.href = s.href || '#'; a.target = '_blank'; a.rel='noopener noreferrer'; a.style.color='var(--muted)';
      const icon = s.icon || 'link'; const map = {instagram:'fab fa-instagram', whatsapp:'fab fa-whatsapp', email:'far fa-envelope'};
      const cls = map[icon] || 'fas fa-link'; a.innerHTML = `<i class="${cls}"></i>`;
      root.appendChild(a);
    });
  }

  /* ---------- Events & boot ---------- */
  function wireEvents(){
    // modal buttons
    $('#modalClose').addEventListener('click', closeProductModal);
    $('#modalAdd').addEventListener('click', ()=>{ if(CURRENT_PRODUCT) addToCart(CURRENT_PRODUCT); closeProductModal(); });
    $('#modalWish').addEventListener('click', ()=>{ if(CURRENT_PRODUCT) toggleWish(CURRENT_PRODUCT); });

    // cart buttons
    $('#btnCloseCart').addEventListener('click', closeCart);
    $('#overlay').addEventListener('click', ()=>{ closeCart(); closeProductModal(); });

    // brand click -> top
    $('#brand').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));
    $('#brand').addEventListener('keydown', e=>{ if(e.key==='Enter') window.scrollTo({top:0,behavior:'smooth'}); });

    // keyboard
    document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeProductModal(); closeCart(); }});
  }

  async function boot(){
    try {
      await loadConfig();
      applyTheme();

      // build PRODUCTS
      if(Array.isArray(CONFIG.catalog.products) && CONFIG.catalog.products.length) PRODUCTS = CONFIG.catalog.products.map((p,i)=>({...p, id: p.id||`prod_${i+1}`}));
      else PRODUCTS = generateMocks((CONFIG.catalog.mock && CONFIG.catalog.mock.count) || 12, (CONFIG.catalog.mock && CONFIG.catalog.mock.basePrice) || 120);

      // render UI
      renderNav();
      renderHero();
      renderSections();
      renderCart();
      renderFooter();
      wireEvents();

    } catch(e){
      console.error('Erro na inicialização:', e);
    } finally {
      // remove loader e exibir conteúdo sempre (corrige "tela em branco")
      const loader = document.getElementById('page-loader'); if(loader) loader.remove();
      document.body.classList.add('ready');
    }
  }

  // protege erros globais e garante que a UI seja mostrada
  window.addEventListener('error', function(evt){
    console.error('Erro global:', evt && evt.message || evt);
    const loader = document.getElementById('page-loader'); if(loader) loader.remove();
    document.body.classList.add('ready');
  });
  window.addEventListener('unhandledrejection', function(evt){
    console.error('Promise rejeitada:', evt && evt.reason || evt);
    const loader = document.getElementById('page-loader'); if(loader) loader.remove();
    document.body.classList.add('ready');
  });

  // exposições úteis (somente para administrador / console)
  window.BellaFlor = window.BellaFlor || {};
  Object.defineProperty(window.BellaFlor, 'config', { get: ()=> CONFIG });
  window.BellaFlor.applyConfig = function(obj){ // aplicar config através do console (dev)
    try {
      if(!obj || typeof obj !== 'object') throw new Error('applyConfig precisa de um objeto');
      CONFIG = mergeDeep(DEFAULT, obj);
      applyTheme();
      PRODUCTS = Array.isArray(CONFIG.catalog.products) && CONFIG.catalog.products.length ? CONFIG.catalog.products : generateMocks(CONFIG.catalog.mock.count||12, CONFIG.catalog.mock.basePrice||120);
      renderNav(); renderHero(); renderSections(); renderCart(); renderFooter();
      console.info('Config aplicada via console.');
    } catch(e){ console.error('applyConfig falhou', e); }
  };

  // start
  boot();

})();
</script>
</body>
</html>
