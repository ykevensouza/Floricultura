<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BellaFlor | Atelier Floral Premium</title>
    <meta name="description" content="BellaFlor - Design floral exclusivo e presentes inesquecíveis em Artur Nogueira.">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* CSS Reset & Base Global */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        :root {
            --primary: #d64c63;
            --gold: #c5a059;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fff; }
        ::-webkit-scrollbar-thumb { background: #ecccd3; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #fdfbfb;
            background-image: radial-gradient(#f3e6e8 1px, transparent 1px);
            background-size: 30px 30px;
            color: #2d3436; 
            overflow-x: hidden;
            opacity: 0; transition: opacity 1s ease;
        }
        body.loaded { opacity: 1; }
        
        /* Loader Elegante */
        .loader-wrapper {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loader-wrapper.hidden { opacity: 0; visibility: hidden; }
        .flower-spinner { font-size: 3rem; color: var(--primary); animation: spin-slow 3s infinite linear; }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="root">
        <div class="loader-wrapper">
            <i class="fas fa-fan flower-spinner"></i>
            <p style="margin-top: 15px; font-family: 'Cormorant Garamond'; letter-spacing: 2px; color: #555;">PREPARANDO O JARDIM...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const styled = window.styled;

        // ==================================================================================
        // 1. ÁREA DE CONFIGURAÇÃO (FUTURO CONFIG.JS)
        // ----------------------------------------------------------------------------------
        // Tudo daqui para baixo até o marcador "FIM DA CONFIGURAÇÃO" será movido futuramente.
        // ==================================================================================
        
        const CONFIG = {
            store: {
                name: "BellaFlor",
                slogan: "Atelier Floral",
                city: "Artur Nogueira",
                whatsapp: "551938279999", 
                since: "2010",
                instagram: "@bellaflor_artur",
                email: "contato@bellaflor.com"
            },
            theme: {
                colors: {
                    primary: '#d64c63',      // Rosa queimado elegante
                    primaryLight: '#fbe6ea', // Fundo suave
                    secondary: '#2d3436',    // Texto escuro
                    gold: '#c5a059',         // Detalhes dourados
                    bg: '#fdfbfb',           // Fundo Off-white
                    success: '#27ae60'       // Verde sucesso
                },
                fonts: {
                    heading: "'Cormorant Garamond', serif",
                    body: "'Montserrat', sans-serif"
                }
            },
            hero: {
                headline: "Flores que eternizam momentos",
                subheadline: "Design floral autoral e exclusivo em Artur Nogueira. Transforme sentimentos em arte.",
                bgImage: "https://images.unsplash.com/photo-1507290431195-26ab47d4940d?auto=format&fit=crop&w=1920&q=80",
                buttonText: "Explorar Coleção"
            },
            categories: ['Todos', 'Buquês', 'Arranjos', 'Box Luxo', 'Orquídeas', 'Cestas']
        };

        // --- MOCK DATABASE & UTILS ---
        
        // Utilitário de Imagens Inteligente
        const getFlowerImage = (term, index) => {
            const map = {
                'rosa': ['1562690868-60bbe7293e94', '1518709268805-4e9042af9f23'],
                'girassol': ['1470509037663-253afd7f0f51', '1532009804797-28d8745d064c'],
                'lirio': ['1525253815340-d9d2e1c9e830'],
                'orquidea': ['1566929341488-820845a76cb5', '1561181286-d3fee7d55364'],
                'tulipa': ['1520763185298-1b434c919102'],
                'campo': ['1464698579707-353232147316']
            };
            const key = Object.keys(map).find(k => term.toLowerCase().includes(k)) || 'campo';
            const ids = map[key];
            return `https://images.unsplash.com/photo-${ids[index % ids.length]}?auto=format&fit=crop&w=800&q=80`;
        };

        // Gerador de Produtos
        const PRODUCTS = Array.from({ length: 32 }, (_, i) => {
            const types = ['Buquê', 'Arranjo', 'Box', 'Cesta', 'Vaso'];
            const flowers = ['Rosas Vermelhas', 'Girassóis', 'Lírios Brancos', 'Tulipas', 'Mix do Campo', 'Orquídeas Phalaenopsis', 'Rosas Colombianas'];
            const adjs = ['Imperial', 'Eterno', 'Radiante', 'Apaixonante', 'Minimalista', 'Clássico', 'Silvestre'];
            
            const type = types[i % types.length];
            const flower = flowers[i % flowers.length];
            const adj = adjs[i % adjs.length];
            
            // Auto Categorização
            let cat = 'Arranjos';
            if(type === 'Buquê') cat = 'Buquês';
            else if(type === 'Box') cat = 'Box Luxo';
            else if(type === 'Cesta') cat = 'Cestas';
            else if(flower.includes('Orquídeas')) cat = 'Orquídeas';

            return {
                id: i + 1,
                name: `${type} ${adj}`,
                subtitle: `Com ${flower} selecionadas`,
                price: (90 + (i * 20) + (Math.random() * 50)).toFixed(2),
                category: cat,
                image: getFlowerImage(flower, i),
                details: "Um design exclusivo feito à mão por nossos floristas experts. Acompanha cartão de mensagem personalizado e instruções de cuidado."
            };
        });

        // ==================================================================================
        // FIM DA CONFIGURAÇÃO - O CÓDIGO ABAIXO É A APLICAÇÃO REACT
        // ==================================================================================

        // --- Styled Components ---

        const GlassNav = styled.nav`
            position: fixed; top: 0; left: 0; right: 0; height: 85px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s;
            &.scrolled { height: 70px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        `;

        const Logo = styled.h1`
            font-family: ${CONFIG.theme.fonts.heading}; font-size: 2rem; color: ${CONFIG.theme.colors.primary};
            font-weight: 700; letter-spacing: -0.5px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            span { font-family: ${CONFIG.theme.fonts.body}; font-size: 0.8rem; color: #666; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; margin-top: 5px; }
            @media(max-width: 768px) { span { display: none; } }
        `;

        const IconsGroup = styled.div`
            display: flex; gap: 20px; align-items: center;
            i { font-size: 1.2rem; cursor: pointer; color: ${CONFIG.theme.colors.secondary}; transition: 0.3s; position: relative; }
            i:hover { color: ${CONFIG.theme.colors.primary}; transform: translateY(-2px); }
            .badge {
                position: absolute; top: -8px; right: -10px; background: ${CONFIG.theme.colors.primary};
                color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; border: 2px solid white; font-weight: bold;
            }
        `;

        const Hero = styled.header`
            height: 95vh; display: flex; align-items: center; justify-content: center; text-align: center; color: white;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('${CONFIG.hero.bgImage}') center/cover fixed;
            position: relative; overflow: hidden;
            
            &::after {
                content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
                background: linear-gradient(to top, ${CONFIG.theme.colors.bg}, transparent);
            }
        `;

        const HeroContent = styled.div`
            z-index: 2; max-width: 800px; padding: 20px;
            h2 { font-family: ${CONFIG.theme.fonts.heading}; font-size: clamp(3rem, 8vw, 5.5rem); margin-bottom: 20px; line-height: 1; text-shadow: 0 4px 15px rgba(0,0,0,0.3); }
            p { font-size: 1.2rem; margin-bottom: 40px; font-weight: 300; letter-spacing: 1px; opacity: 0.9; }
        `;

        const MainBtn = styled.button`
            padding: 18px 45px; background: ${props => props.outline ? 'transparent' : CONFIG.theme.colors.primary};
            color: ${props => props.outline ? 'white' : 'white'}; border: ${props => props.outline ? '1px solid rgba(255,255,255,0.6)' : 'none'};
            font-family: ${CONFIG.theme.fonts.body}; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden;
            
            &:hover { 
                background: ${props => props.outline ? 'white' : '#b63b50'}; 
                color: ${props => props.outline ? CONFIG.theme.colors.secondary : 'white'};
                transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            }
        `;

        const FilterContainer = styled.div`
            position: sticky; top: 85px; background: rgba(253, 251, 251, 0.95); padding: 20px 0; z-index: 900;
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            transition: top 0.3s;
        `;

        const FilterBtn = styled.button`
            background: ${props => props.active ? CONFIG.theme.colors.secondary : 'transparent'};
            color: ${props => props.active ? '#fff' : '#888'};
            border: 1px solid ${props => props.active ? CONFIG.theme.colors.secondary : '#ddd'};
            padding: 8px 24px; border-radius: 30px; cursor: pointer; transition: 0.3s;
            font-family: ${CONFIG.theme.fonts.body}; font-size: 0.85rem; font-weight: 500;
            
            &:hover { border-color: ${CONFIG.theme.colors.secondary}; color: ${CONFIG.theme.colors.secondary}; }
        `;

        const Grid = styled.section`
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px;
            padding: 60px 8%; margin-bottom: 50px;
        `;

        const ProductCard = styled.div`
            background: white; border-radius: 4px; overflow: hidden; position: relative;
            transition: all 0.4s ease; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);

            &:hover { 
                transform: translateY(-10px); 
                box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
                .quick-actions { opacity: 1; transform: translateY(0); }
                img { transform: scale(1.05); }
            }

            .img-container { height: 350px; overflow: hidden; position: relative; background: #f0f0f0; }
            img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s ease; }

            .quick-actions {
                position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px;
                opacity: 0; transform: translateY(20px); transition: 0.4s ease;
            }
            .action-btn {
                width: 40px; height: 40px; border-radius: 50%; background: white; border: none;
                display: flex; align-items: center; justify-content: center; color: ${CONFIG.theme.colors.secondary};
                cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.2s;
                &:hover { background: ${CONFIG.theme.colors.primary}; color: white; }
            }

            .info { padding: 20px; text-align: center; }
            .cat { font-size: 0.7rem; text-transform: uppercase; color: ${CONFIG.theme.colors.gold}; letter-spacing: 2px; font-weight: 600; display: block; margin-bottom: 5px; }
            h3 { font-family: ${CONFIG.theme.fonts.heading}; font-size: 1.4rem; color: ${CONFIG.theme.colors.secondary}; margin-bottom: 5px; }
            .price { font-weight: 600; color: ${CONFIG.theme.colors.primary}; font-size: 1.1rem; margin-top: 10px; display: block; }
        `;

        const Sidebar = styled.div`
            position: fixed; top: 0; right: 0; width: 420px; max-width: 90%; height: 100vh;
            background: white; z-index: 2000; box-shadow: -10px 0 40px rgba(0,0,0,0.1);
            transform: translateX(${props => props.open ? '0' : '100%'}); transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column; padding: 30px;
        `;

        const ModalOverlay = styled.div`
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 2500; display: flex; justify-content: center; align-items: center; padding: 20px;
            opacity: ${props => props.open ? 1 : 0}; pointer-events: ${props => props.open ? 'all' : 'none'}; transition: 0.3s;
        `;

        const ModalBox = styled.div`
            background: white; width: 900px; max-width: 100%; height: 500px; display: flex;
            border-radius: 8px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            transform: scale(${props => props.open ? 1 : 0.9}); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            
            @media(max-width: 768px) { flex-direction: column; height: auto; max-height: 90vh; overflow-y: auto; }
        `;

        const Toast = styled.div`
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: ${CONFIG.theme.colors.secondary}; color: white; padding: 12px 25px;
            border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 3000;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
            animation: fadeInUp 0.5s, fadeOutDown 0.5s 2.5s forwards;

            @keyframes fadeInUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
            @keyframes fadeOutDown { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, 20px); } }
        `;

        // --- Components ---

        const App = () => {
            const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('bellaCart')) || []);
            const [wishlist, setWishlist] = useState(() => JSON.parse(localStorage.getItem('bellaWish')) || []);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [activeCategory, setActiveCategory] = useState('Todos');
            const [modalProduct, setModalProduct] = useState(null);
            const [toast, setToast] = useState(null);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                document.body.classList.add('loaded');
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => { localStorage.setItem('bellaCart', JSON.stringify(cart)); }, [cart]);
            useEffect(() => { localStorage.setItem('bellaWish', JSON.stringify(wishlist)); }, [wishlist]);

            const showToast = (msg, icon = 'check-circle') => {
                setToast({ msg, icon });
                setTimeout(() => setToast(null), 3000);
            };

            const toggleWishlist = (e, product) => {
                e.stopPropagation();
                const exists = wishlist.find(w => w.id === product.id);
                if (exists) {
                    setWishlist(wishlist.filter(w => w.id !== product.id));
                    showToast('Removido dos favoritos', 'heart-broken');
                } else {
                    setWishlist([...wishlist, product]);
                    showToast('Adicionado aos favoritos', 'heart');
                }
            };

            const addToCart = (product) => {
                setCart([...cart, product]);
                setIsCartOpen(true);
                showToast(`${product.name} adicionado!`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
            };

            const cartTotal = cart.reduce((acc, item) => acc + parseFloat(item.price), 0);

            const whatsappLink = useMemo(() => {
                let msg = `*Olá, ${CONFIG.store.name}!* \n\nGostaria de finalizar meu pedido:\n`;
                cart.forEach(item => msg += `▫️ ${item.name} - R$ ${item.price}\n`);
                msg += `\n*Total: R$ ${cartTotal.toFixed(2)}*`;
                return `https://wa.me/${CONFIG.store.whatsapp}?text=${encodeURIComponent(msg)}`;
            }, [cart]);

            const filteredProducts = activeCategory === 'Todos' 
                ? PRODUCTS 
                : PRODUCTS.filter(p => p.category === activeCategory);

            return (
                <>
                    {/* Navigation */}
                    <GlassNav className={scrolled ? 'scrolled' : ''}>
                        <Logo onClick={() => window.scrollTo(0,0)}>
                            {CONFIG.store.name} <span>{CONFIG.store.city}</span>
                        </Logo>
                        <IconsGroup>
                            <i className="fas fa-heart" onClick={() => showToast(`Você tem ${wishlist.length} favoritos`)}>
                                {wishlist.length > 0 && <span className="badge">{wishlist.length}</span>}
                            </i>
                            <i className="fas fa-shopping-bag" onClick={() => setIsCartOpen(true)}>
                                {cart.length > 0 && <span className="badge">{cart.length}</span>}
                            </i>
                        </IconsGroup>
                    </GlassNav>

                    {/* Hero Section */}
                    <Hero>
                        <HeroContent className="animate__animated animate__fadeInUp">
                            <h2>{CONFIG.hero.headline}</h2>
                            <p>{CONFIG.hero.subheadline}</p>
                            <MainBtn onClick={() => document.getElementById('shop').scrollIntoView({behavior: 'smooth'})}>
                                {CONFIG.hero.buttonText}
                            </MainBtn>
                        </HeroContent>
                    </Hero>

                    {/* Filters */}
                    <FilterContainer id="shop">
                        {CONFIG.categories.map(cat => (
                            <FilterBtn key={cat} active={activeCategory === cat} onClick={() => setActiveCategory(cat)}>
                                {cat}
                            </FilterBtn>
                        ))}
                    </FilterContainer>

                    {/* Product Grid */}
                    <Grid>
                        {filteredProducts.map((product, idx) => (
                            <ProductCard key={product.id} onClick={() => setModalProduct(product)} style={{animationDelay: `${idx * 50}ms`}} className="animate__animated animate__fadeIn">
                                <div className="img-container">
                                    <img src={product.image} alt={product.name} loading="lazy" />
                                    <div className="quick-actions">
                                        <button className="action-btn" onClick={(e) => toggleWishlist(e, product)}>
                                            <i className={wishlist.find(w => w.id === product.id) ? "fas fa-heart" : "far fa-heart"} style={{color: wishlist.find(w => w.id === product.id) ? CONFIG.theme.colors.primary : ''}}></i>
                                        </button>
                                        <button className="action-btn" onClick={(e) => { e.stopPropagation(); addToCart(product); }}>
                                            <i className="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <div className="info">
                                    <span className="cat">{product.category}</span>
                                    <h3>{product.name}</h3>
                                    <p style={{fontSize: '0.85rem', color: '#888', marginBottom: '8px'}}>{product.subtitle}</p>
                                    <span className="price">R$ {product.price.replace('.', ',')}</span>
                                </div>
                            </ProductCard>
                        ))}
                    </Grid>

                    {/* Footer */}
                    <footer style={{background: '#f8f8f8', padding: '80px 10%', textAlign: 'center', borderTop: '1px solid #eee'}}>
                        <h2 style={{fontFamily: CONFIG.theme.fonts.heading, fontSize: '2.5rem', color: CONFIG.theme.colors.primary}}>{CONFIG.store.name}</h2>
                        <div style={{margin: '30px 0', fontSize: '1.5rem', color: CONFIG.theme.colors.secondary}}>
                            <i className="fab fa-instagram" style={{margin: '0 15px', cursor: 'pointer'}}></i>
                            <i className="fab fa-whatsapp" style={{margin: '0 15px', cursor: 'pointer'}}></i>
                            <i className="far fa-envelope" style={{margin: '0 15px', cursor: 'pointer'}}></i>
                        </div>
                        <p style={{color: '#999', fontSize: '0.9rem'}}>&copy; 2024 {CONFIG.store.name} • Feito com amor.</p>
                    </footer>

                    {/* Cart Sidebar */}
                    <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 1900, opacity: isCartOpen ? 1 : 0, pointerEvents: isCartOpen ? 'all' : 'none', transition: '0.3s'}} onClick={() => setIsCartOpen(false)}></div>
                    <Sidebar open={isCartOpen}>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px', borderBottom: '1px solid #eee', paddingBottom: '20px'}}>
                            <h2 style={{fontFamily: CONFIG.theme.fonts.heading}}>Sua Seleção</h2>
                            <i className="fas fa-times" onClick={() => setIsCartOpen(false)} style={{cursor: 'pointer', fontSize: '1.5rem'}}></i>
                        </div>
                        
                        <div style={{flex: 1, overflowY: 'auto'}}>
                            {cart.length === 0 ? (
                                <p style={{textAlign: 'center', color: '#999', marginTop: '50px'}}>Seu carrinho está vazio.</p>
                            ) : (
                                cart.map((item, index) => (
                                    <div key={index} style={{display: 'flex', gap: '15px', marginBottom: '20px'}}>
                                        <img src={item.image} style={{width: '70px', height: '70px', objectFit: 'cover', borderRadius: '4px'}} />
                                        <div style={{flex: 1}}>
                                            <h4 style={{fontSize: '0.9rem'}}>{item.name}</h4>
                                            <span style={{color: CONFIG.theme.colors.primary, fontWeight: 'bold'}}>R$ {item.price.replace('.', ',')}</span>
                                        </div>
                                        <i className="far fa-trash-alt" onClick={() => removeFromCart(index)} style={{color: '#aaa', cursor: 'pointer'}}></i>
                                    </div>
                                ))
                            )}
                        </div>

                        <div style={{borderTop: '1px solid #eee', paddingTop: '20px'}}>
                            <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '1.2rem', fontWeight: 'bold', marginBottom: '20px'}}>
                                <span>Total</span>
                                <span>R$ {cartTotal.toFixed(2).replace('.', ',')}</span>
                            </div>
                            <a href={whatsappLink} target="_blank" style={{display: 'block', padding: '15px', background: '#25D366', color: 'white', textAlign: 'center', textDecoration: 'none', borderRadius: '4px', fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '1px'}}>
                                Finalizar Pedido
                            </a>
                        </div>
                    </Sidebar>

                    {/* Product Quick View Modal */}
                    <ModalOverlay open={!!modalProduct} onClick={() => setModalProduct(null)}>
                        {modalProduct && (
                            <ModalBox open={!!modalProduct} onClick={e => e.stopPropagation()}>
                                <div style={{flex: 1, background: `url(${modalProduct.image}) center/cover`}}></div>
                                <div style={{flex: 1, padding: '40px', display: 'flex', flexDirection: 'column', justifyContent: 'center'}}>
                                    <span style={{color: CONFIG.theme.colors.gold, textTransform: 'uppercase', letterSpacing: '2px', fontSize: '0.8rem', fontWeight: 'bold'}}>{modalProduct.category}</span>
                                    <h2 style={{fontFamily: CONFIG.theme.fonts.heading, fontSize: '2.5rem', margin: '10px 0', lineHeight: 1}}>{modalProduct.name}</h2>
                                    <p style={{fontSize: '1.5rem', color: CONFIG.theme.colors.primary, fontWeight: 'bold', marginBottom: '20px'}}>R$ {modalProduct.price.replace('.', ',')}</p>
                                    <p style={{color: '#666', lineHeight: '1.6', marginBottom: '30px'}}>{modalProduct.details}</p>
                                    
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <MainBtn onClick={() => { addToCart(modalProduct); setModalProduct(null); }}>Adicionar ao Carrinho</MainBtn>
                                        <MainBtn outline onClick={() => { toggleWishlist({}, modalProduct); setModalProduct(null); }} style={{borderColor: '#ddd', color: '#666'}}>
                                            <i className="far fa-heart"></i>
                                        </MainBtn>
                                    </div>
                                </div>
                                <button onClick={() => setModalProduct(null)} style={{position: 'absolute', top: '20px', right: '20px', background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer', zIndex: 10}}>&times;</button>
                            </ModalBox>
                        )}
                    </ModalOverlay>

                    {/* Toast Notification */}
                    {toast && (
                        <Toast>
                            <i className={`fas fa-${toast.icon}`}></i> {toast.msg}
                        </Toast>
                    )}

                    {/* WhatsApp Float */}
                    <a href={`https://wa.me/${CONFIG.store.whatsapp}`} target="_blank" style={{
                        position: 'fixed', bottom: '30px', right: '30px', width: '60px', height: '60px', background: '#25D366', color: 'white', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '2rem', boxShadow: '0 10px 25px rgba(37,211,102,0.3)', zIndex: 990, textDecoration: 'none'
                    }}>
                        <i className="fab fa-whatsapp"></i>
                    </a>

                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
