<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BellaFlor | Atelier Floral Premium</title>
    <meta name="description" content="BellaFlor - Design floral exclusivo e presentes inesquecíveis.">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Pinyon+Script&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* CSS Reset & Critical CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        :root {
            --loader-color: #d4a373;
        }

        body { 
            background-color: #fcfcfc;
            color: #1a1a1a; 
            overflow-x: hidden;
            opacity: 0; transition: opacity 0.8s ease;
        }
        body.loaded { opacity: 1; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d4a373; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b08968; }

        /* Loader Animation */
        .loader-wrapper {
            position: fixed; inset: 0; background: #fffdf9; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .loader-wrapper.hidden { opacity: 0; visibility: hidden; }
        .petal-spinner { font-size: 4rem; color: var(--loader-color); animation: breathe 2s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="root">
        <div class="loader-wrapper">
            <i class="fas fa-seedling petal-spinner"></i>
            <p style="margin-top: 20px; font-family: 'Cinzel', serif; letter-spacing: 3px; color: #888; font-size: 0.8rem;">CULTIVANDO BELEZA...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const styled = window.styled;

        // ==================================================================================
        // ⚠️ ARQUIVO DE CONFIGURAÇÃO SIMULADO (PREPARADO PARA O CONFIG.JSON) ⚠️
        // ==================================================================================
        
        const CONFIG = {
            meta: {
                version: "2.0",
                last_updated: "2026-01-05"
            },
            store: {
                info: {
                    name: "BellaFlor",
                    subtitle: "Atelier Botânico",
                    city: "Artur Nogueira",
                    since: "Desde 2010",
                    whatsapp_number: "551938279999" // Formato internacional sem +
                },
                links: {
                    instagram: "https://instagram.com",
                    facebook: "https://facebook.com",
                    email: "mailto:contato@bellaflor.com.br"
                }
            },
            theme: {
                colors: {
                    primary: "#bf6c74",      // Rosa Antigo
                    secondary: "#2c3e50",    // Azul Noturno (Texto forte)
                    accent: "#d4a373",       // Dourado Matte
                    background: "#fdfbf7",   // Papel Off-white
                    card_bg: "#ffffff",
                    success: "#6ab04c",
                    text_light: "#7f8c8d"
                },
                fonts: {
                    heading: "'Cinzel', serif",
                    script: "'Pinyon Script', cursive",
                    body: "'Lato', sans-serif"
                },
                ui: {
                    radius: "2px", // Design mais quadrado/elegante
                    shadow: "0 10px 40px -10px rgba(0,0,0,0.08)"
                }
            },
            texts: {
                hero: {
                    title: "A Poesia das Flores",
                    subtitle: "Arranjos autorais que traduzem sentimentos em Artur Nogueira. Do clássico ao contemporâneo.",
                    cta: "Ver Coleção",
                    bg_image: "https://images.unsplash.com/photo-1563241527-300027f88ea2?auto=format&fit=crop&w=1920&q=80"
                },
                footer: {
                    copyright: "Todos os direitos reservados.",
                    made_by: "Design Exclusivo"
                },
                cart: {
                    title: "Seu Jardim",
                    empty: "Sua cesta de flores está vazia no momento.",
                    checkout: "Finalizar no WhatsApp",
                    total: "Subtotal"
                },
                product: {
                    currency: "R$",
                    add_to_cart: "Adicionar à Cesta",
                    quick_view: "Espiar"
                }
            },
            catalog: {
                categories: ["Todos", "Buquês", "Arranjos", "Box Luxo", "Orquídeas", "Secas & Preservadas"],
                // Configuração para o Gerador de Mock (pode ser removido quando vier do JSON real)
                mock_settings: {
                    count: 24,
                    base_price: 120
                }
            }
        };

        // --- MOCK DATABASE GENERATOR (Simulação de Backend) ---
        // Esta parte gera dados baseados no CONFIG.catalog.mock_settings
        
        const MOCK_DATA = (() => {
            const flowers = [
                { name: 'Rosas Colombianas', key: 'rosa', priceMod: 1.5 },
                { name: 'Hortênsias Azuis', key: 'hydrangea', priceMod: 1.2 },
                { name: 'Orquídea Phalaenopsis', key: 'orchid', priceMod: 2.0 },
                { name: 'Girassóis Vibrantes', key: 'sunflower', priceMod: 0.9 },
                { name: 'Mix do Campo', key: 'wildflower', priceMod: 0.8 },
                { name: 'Tulipas Holandesas', key: 'tulip', priceMod: 1.8 },
                { name: 'Lisianthus Premium', key: 'flower', priceMod: 1.1 },
                { name: 'Folhagens Secas', key: 'dried', priceMod: 1.3 }
            ];

            const adjectives = ['Imperial', 'Aurora', 'Romance', 'Serenidade', 'Majestade', 'Poesia', 'Vintage', 'Minimal'];
            const containers = ['em Vaso de Cristal', 'no Kraft', 'na Box Aveludada', 'Rústico', 'Hand-tied'];

            const getImage = (term, i) => {
                // IDs curados do Unsplash para garantir beleza
                const map = {
                    'rosa': ['1562690868-60bbe7293e94', '1518709268805-4e9042af9f23'],
                    'hydrangea': ['1508610048181-48f6704e3f36'],
                    'orchid': ['1566929341488-820845a76cb5'],
                    'sunflower': ['1470509037663-253afd7f0f51'],
                    'tulip': ['1520763185298-1b434c919102'],
                    'wildflower': ['1464698579707-353232147316'],
                    'dried': ['1533616688419-b7a58556e124']
                };
                const key = Object.keys(map).find(k => term.toLowerCase().includes(k)) || 'wildflower';
                const collection = map[key] || map['wildflower'];
                return `https://images.unsplash.com/photo-${collection[i % collection.length]}?auto=format&fit=crop&w=800&q=80`;
            };

            return Array.from({ length: CONFIG.catalog.mock_settings.count }, (_, i) => {
                const flower = flowers[i % flowers.length];
                const adj = adjectives[i % adjectives.length];
                const container = containers[i % containers.length];
                
                // Categorização Automática Inteligente
                let cat = 'Arranjos';
                if(container.includes('Kraft') || container.includes('Hand-tied')) cat = 'Buquês';
                if(container.includes('Box')) cat = 'Box Luxo';
                if(flower.name.includes('Orquídea')) cat = 'Orquídeas';
                if(flower.name.includes('Secas')) cat = 'Secas & Preservadas';

                const price = (CONFIG.catalog.mock_settings.base_price * flower.priceMod + (Math.random() * 40)).toFixed(2);

                return {
                    id: `prod_${i + 1}`,
                    name: `${flower.name} ${adj}`,
                    subtitle: `${container} • Design Exclusivo`,
                    category: cat,
                    price: price,
                    image: getImage(flower.key, i),
                    description: `Uma composição artística elaborada com ${flower.name} frescas e selecionadas. Ideal para expressar sentimentos profundos. Acompanha cartão de mensagem e instruções de cuidado. A durabilidade média é de 5 a 7 dias com os devidos cuidados.`
                };
            });
        })();

        // --- UTILS (Funções Auxiliares) ---
        const formatMoney = (val) => {
            return parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        // ==================================================================================
        // APLICAÇÃO REACT
        // ==================================================================================

        // --- Styled Components ---

        const Wrapper = styled.div`font-family: ${CONFIG.theme.fonts.body}; color: ${CONFIG.theme.colors.secondary};`;

        const Navbar = styled.nav`
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.03); transition: all 0.3s;
            &.scrolled { padding: 10px 5%; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        `;

        const Brand = styled.div`
            text-align: center; cursor: pointer;
            h1 { font-family: ${CONFIG.theme.fonts.heading}; font-size: 1.8rem; letter-spacing: 2px; color: ${CONFIG.theme.colors.primary}; text-transform: uppercase; margin: 0; }
            span { font-family: ${CONFIG.theme.fonts.script}; font-size: 1.1rem; color: ${CONFIG.theme.colors.accent}; display: block; margin-top: -5px; }
        `;

        const Actions = styled.div`
            display: flex; gap: 25px; align-items: center;
            i { font-size: 1.1rem; color: ${CONFIG.theme.colors.secondary}; cursor: pointer; transition: 0.2s; position: relative; }
            i:hover { color: ${CONFIG.theme.colors.primary}; }
            .badge { 
                position: absolute; top: -8px; right: -8px; background: ${CONFIG.theme.colors.primary}; color: white; 
                font-size: 0.6rem; padding: 2px 5px; border-radius: 50%; font-weight: bold; font-family: sans-serif;
            }
        `;

        const Hero = styled.header`
            height: 90vh; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.1)), url('${CONFIG.texts.hero.bg_image}') center/cover fixed;
            margin-bottom: 60px; color: white; padding: 20px;
        `;

        const HeroText = styled.div`
            h2 { font-family: ${CONFIG.theme.fonts.script}; font-size: clamp(3rem, 6vw, 5rem); color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.2); margin-bottom: 10px; }
            p { font-family: ${CONFIG.theme.fonts.heading}; font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
        `;

        const Button = styled.button`
            padding: 15px 40px; border: 1px solid ${props => props.outline ? CONFIG.theme.colors.secondary : 'transparent'};
            background: ${props => props.outline ? 'transparent' : CONFIG.theme.colors.primary};
            color: ${props => props.outline ? CONFIG.theme.colors.secondary : 'white'};
            font-family: ${CONFIG.theme.fonts.heading}; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;
            cursor: pointer; transition: 0.4s; border-radius: ${CONFIG.theme.ui.radius};
            &:hover { background: ${CONFIG.theme.colors.secondary}; color: white; transform: translateY(-2px); border-color: transparent; }
        `;

        const CategoryBar = styled.div`
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 50px; padding: 0 20px;
        `;

        const CatLink = styled.button`
            background: none; border: none; font-family: ${CONFIG.theme.fonts.heading}; 
            font-size: 0.9rem; letter-spacing: 1px; color: ${props => props.active ? CONFIG.theme.colors.primary : '#999'};
            cursor: pointer; padding-bottom: 5px; border-bottom: 2px solid ${props => props.active ? CONFIG.theme.colors.primary : 'transparent'};
            transition: 0.3s;
            &:hover { color: ${CONFIG.theme.colors.primary}; }
        `;

        const Grid = styled.section`
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px;
            padding: 0 8% 80px; max-width: 1600px; margin: 0 auto;
        `;

        const Card = styled.div`
            background: ${CONFIG.theme.colors.card_bg}; border-radius: ${CONFIG.theme.ui.radius};
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            &:hover { transform: translateY(-10px); box-shadow: ${CONFIG.theme.ui.shadow}; }
            
            .img-box { 
                height: 400px; overflow: hidden; position: relative; border-radius: ${CONFIG.theme.ui.radius};
                cursor: pointer;
            }
            img { width: 100%; height: 100%; object-fit: cover; transition: 1s ease; }
            &:hover img { transform: scale(1.08); }

            .overlay {
                position: absolute; inset: 0; background: rgba(255,255,255,0.1); opacity: 0;
                display: flex; align-items: center; justify-content: center;
                transition: 0.3s;
            }
            &:hover .overlay { opacity: 1; }

            .info { padding: 20px 0; text-align: center; }
            .cat-tag { font-size: 0.7rem; color: ${CONFIG.theme.colors.accent}; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; }
            h3 { font-family: ${CONFIG.theme.fonts.heading}; font-size: 1.3rem; margin: 8px 0; color: ${CONFIG.theme.colors.secondary}; font-weight: 600; }
            .price { font-family: ${CONFIG.theme.fonts.body}; color: ${CONFIG.theme.colors.text_light}; font-size: 1.1rem; }
        `;

        const Modal = styled.div`
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            opacity: ${props => props.open ? 1 : 0}; pointer-events: ${props => props.open ? 'all' : 'none'}; transition: 0.3s;

            .modal-content {
                background: white; width: 1000px; max-width: 100%; max-height: 90vh; overflow-y: auto;
                display: grid; grid-template-columns: 1fr 1fr; border-radius: ${CONFIG.theme.ui.radius};
                box-shadow: 0 25px 50px rgba(0,0,0,0.2);
                @media(max-width: 768px) { grid-template-columns: 1fr; }
            }
            .modal-img { height: 100%; min-height: 300px; background-size: cover; background-position: center; }
            .modal-details { padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        `;

        const Sidebar = styled.div`
            position: fixed; top: 0; right: 0; height: 100vh; width: 400px; max-width: 90%;
            background: white; z-index: 2100; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            transform: translateX(${props => props.open ? '0' : '100%'}); transition: 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column;
            .header { padding: 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
            .body { flex: 1; overflow-y: auto; padding: 25px; }
            .footer { padding: 25px; border-top: 1px solid #eee; background: #fafafa; }
        `;

        // --- App Component ---

        const App = () => {
            const [products, setProducts] = useState([]);
            const [activeCat, setActiveCat] = useState(CONFIG.catalog.categories[0]);
            const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('bellaCart')) || []);
            const [wishlist, setWishlist] = useState(() => JSON.parse(localStorage.getItem('bellaWish')) || []);
            const [modalData, setModalData] = useState(null);
            const [isCartOpen, setCartOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            // Init
            useEffect(() => {
                // Simula fetch do banco de dados
                setProducts(MOCK_DATA);
                document.body.classList.add('loaded');
                window.addEventListener('scroll', () => setScrolled(window.scrollY > 50));
                return () => window.removeEventListener('scroll', () => {});
            }, []);

            // Persistence
            useEffect(() => { localStorage.setItem('bellaCart', JSON.stringify(cart)) }, [cart]);
            useEffect(() => { localStorage.setItem('bellaWish', JSON.stringify(wishlist)) }, [wishlist]);

            // Logic
            const addToCart = (prod) => {
                setCart([...cart, prod]);
                setCartOpen(true);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
            };

            const toggleWish = (prod) => {
                const exists = wishlist.find(i => i.id === prod.id);
                if(exists) setWishlist(wishlist.filter(i => i.id !== prod.id));
                else setWishlist([...wishlist, prod]);
            };

            const getFilteredProducts = () => {
                if(activeCat === CONFIG.catalog.categories[0]) return products;
                return products.filter(p => p.category === activeCat);
            };

            const cartTotal = cart.reduce((acc, item) => acc + parseFloat(item.price), 0);
            
            const whatsappMsg = useMemo(() => {
                let msg = `Olá, vim pelo site da *${CONFIG.store.info.name}*!\n\n${CONFIG.texts.cart.title}:\n`;
                cart.forEach(i => msg += `• ${i.name} - ${formatMoney(i.price)}\n`);
                msg += `\n*Total: ${formatMoney(cartTotal)}*`;
                return `https://wa.me/${CONFIG.store.info.whatsapp_number}?text=${encodeURIComponent(msg)}`;
            }, [cart, cartTotal]);

            return (
                <Wrapper>
                    {/* Navigation */}
                    <Navbar className={scrolled ? 'scrolled' : ''}>
                        <div style={{width: '80px'}}>
                            <i className="fas fa-bars" style={{cursor: 'pointer', fontSize: '1.2rem'}}></i>
                        </div>
                        <Brand onClick={() => window.scrollTo(0,0)}>
                            <h1>{CONFIG.store.info.name}</h1>
                            <span>{CONFIG.store.info.subtitle}</span>
                        </Brand>
                        <Actions>
                            <i className={wishlist.length > 0 ? "fas fa-heart" : "far fa-heart"} onClick={() => alert(`${wishlist.length} itens salvos`)} style={{color: wishlist.length > 0 ? CONFIG.theme.colors.primary : ''}}></i>
                            <i className="fas fa-shopping-bag" onClick={() => setCartOpen(true)}>
                                {cart.length > 0 && <span className="badge">{cart.length}</span>}
                            </i>
                        </Actions>
                    </Navbar>

                    {/* Hero */}
                    <Hero>
                        <HeroText className="animate__animated animate__fadeInUp">
                            <p>{CONFIG.texts.hero.title}</p>
                            <h2>{CONFIG.store.info.name}</h2>
                            <p style={{fontSize: '1rem', textTransform: 'none', maxWidth: '600px', margin: '0 auto 40px'}}>{CONFIG.texts.hero.subtitle}</p>
                            <Button onClick={() => document.getElementById('collection').scrollIntoView({behavior: 'smooth'})}>
                                {CONFIG.texts.hero.cta}
                            </Button>
                        </HeroText>
                    </Hero>

                    {/* Filters */}
                    <CategoryBar id="collection">
                        {CONFIG.catalog.categories.map(cat => (
                            <CatLink key={cat} active={activeCat === cat} onClick={() => setActiveCat(cat)}>
                                {cat}
                            </CatLink>
                        ))}
                    </CategoryBar>

                    {/* Grid */}
                    <Grid>
                        {getFilteredProducts().map((prod, i) => (
                            <Card key={prod.id} className="animate__animated animate__fadeIn" style={{animationDelay: `${i*50}ms`}} onClick={() => setModalData(prod)}>
                                <div className="img-box">
                                    <img src={prod.image} alt={prod.name} loading="lazy" />
                                    <div className="overlay">
                                        <Button outline style={{borderColor: '#fff', color: '#fff', padding: '10px 25px', fontSize: '0.7rem'}}>{CONFIG.texts.product.quick_view}</Button>
                                    </div>
                                    {wishlist.find(w => w.id === prod.id) && 
                                        <div style={{position: 'absolute', top: 10, right: 10, color: CONFIG.theme.colors.primary}}><i className="fas fa-heart"></i></div>
                                    }
                                </div>
                                <div className="info">
                                    <span className="cat-tag">{prod.category}</span>
                                    <h3>{prod.name}</h3>
                                    <div className="price">{formatMoney(prod.price)}</div>
                                </div>
                            </Card>
                        ))}
                    </Grid>

                    {/* Footer */}
                    <footer style={{background: '#f8f8f8', padding: '80px 20px', textAlign: 'center', borderTop: '1px solid #eaeaea'}}>
                        <h2 style={{fontFamily: CONFIG.theme.fonts.heading, color: CONFIG.theme.colors.primary, marginBottom: '20px'}}>{CONFIG.store.info.name}</h2>
                        <div style={{display: 'flex', justifyContent: 'center', gap: '20px', fontSize: '1.5rem', color: '#888', marginBottom: '30px'}}>
                            <a href={CONFIG.store.links.instagram} target="_blank"><i className="fab fa-instagram"></i></a>
                            <a href={`https://wa.me/${CONFIG.store.info.whatsapp_number}`} target="_blank"><i className="fab fa-whatsapp"></i></a>
                            <a href={CONFIG.store.links.email}><i className="far fa-envelope"></i></a>
                        </div>
                        <p style={{color: '#aaa', fontSize: '0.8rem'}}>© 2024 {CONFIG.store.info.name}. {CONFIG.texts.footer.made_by}.</p>
                    </footer>

                    {/* Cart Sidebar */}
                    <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 2050, opacity: isCartOpen ? 1 : 0, pointerEvents: isCartOpen ? 'all' : 'none', transition: '0.3s'}} onClick={() => setCartOpen(false)} />
                    <Sidebar open={isCartOpen}>
                        <div className="header">
                            <h3 style={{fontFamily: CONFIG.theme.fonts.heading, margin: 0}}>{CONFIG.texts.cart.title}</h3>
                            <i className="fas fa-times" onClick={() => setCartOpen(false)} style={{cursor: 'pointer'}}></i>
                        </div>
                        <div className="body">
                            {cart.length === 0 ? (
                                <p style={{textAlign: 'center', color: '#999', marginTop: '50px'}}>{CONFIG.texts.cart.empty}</p>
                            ) : (
                                cart.map((item, idx) => (
                                    <div key={idx} style={{display: 'flex', gap: '15px', marginBottom: '20px', alignItems: 'center'}}>
                                        <img src={item.image} style={{width: '60px', height: '60px', borderRadius: '4px', objectFit: 'cover'}} />
                                        <div style={{flex: 1}}>
                                            <h4 style={{fontSize: '0.9rem', marginBottom: '5px'}}>{item.name}</h4>
                                            <span style={{color: CONFIG.theme.colors.primary, fontWeight: 'bold'}}>{formatMoney(item.price)}</span>
                                        </div>
                                        <i className="far fa-trash-alt" onClick={() => removeFromCart(idx)} style={{color: '#ccc', cursor: 'pointer'}}></i>
                                    </div>
                                ))
                            )}
                        </div>
                        <div className="footer">
                            <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '20px', fontWeight: 'bold', fontSize: '1.1rem'}}>
                                <span>{CONFIG.texts.cart.total}</span>
                                <span>{formatMoney(cartTotal)}</span>
                            </div>
                            <a href={whatsappMsg} target="_blank" style={{
                                display: 'block', padding: '18px', background: '#25D366', color: 'white', 
                                textAlign: 'center', textDecoration: 'none', borderRadius: '4px', 
                                fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '1px', fontSize: '0.9rem'
                            }}>
                                {CONFIG.texts.cart.checkout} <i className="fab fa-whatsapp" style={{marginLeft: '5px'}}></i>
                            </a>
                        </div>
                    </Sidebar>

                    {/* Product Modal */}
                    <Modal open={!!modalData} onClick={() => setModalData(null)}>
                        {modalData && (
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <div className="modal-img" style={{backgroundImage: `url(${modalData.image})`}}></div>
                                <div className="modal-details">
                                    <span style={{color: CONFIG.theme.colors.accent, textTransform: 'uppercase', letterSpacing: '2px', fontWeight: 'bold', fontSize: '0.8rem'}}>{modalData.category}</span>
                                    <h2 style={{fontFamily: CONFIG.theme.fonts.heading, fontSize: '2.5rem', margin: '10px 0', lineHeight: 1.1}}>{modalData.name}</h2>
                                    <p style={{fontSize: '1.5rem', color: CONFIG.theme.colors.primary, margin: '15px 0'}}>{formatMoney(modalData.price)}</p>
                                    <p style={{color: '#666', lineHeight: 1.6, marginBottom: '30px'}}>{modalData.description}</p>
                                    
                                    <div style={{display: 'flex', gap: '15px'}}>
                                        <Button onClick={() => { addToCart(modalData); setModalData(null); }} style={{flex: 1}}>
                                            {CONFIG.texts.product.add_to_cart}
                                        </Button>
                                        <Button outline onClick={() => { toggleWish(modalData); }} style={{borderColor: '#ddd', color: wishlist.find(w => w.id === modalData.id) ? CONFIG.theme.colors.primary : '#888'}}>
                                            <i className={wishlist.find(w => w.id === modalData.id) ? "fas fa-heart" : "far fa-heart"}></i>
                                        </Button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </Modal>

                    {/* Floating WhatsApp */}
                    <a href={`https://wa.me/${CONFIG.store.info.whatsapp_number}`} target="_blank" style={{
                        position: 'fixed', bottom: '30px', right: '30px', width: '60px', height: '60px', 
                        background: '#25D366', color: 'white', borderRadius: '50%', display: 'flex', 
                        alignItems: 'center', justifyContent: 'center', fontSize: '2rem', 
                        boxShadow: '0 10px 25px rgba(37,211,102,0.4)', zIndex: 1900, textDecoration: 'none',
                        transition: 'transform 0.3s'
                    }} onMouseOver={e => e.currentTarget.style.transform = 'scale(1.1)'} onMouseOut={e => e.currentTarget.style.transform = 'scale(1.0)'}>
                        <i className="fab fa-whatsapp"></i>
                    </a>
                </Wrapper>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
