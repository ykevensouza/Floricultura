<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BellaFlor | Atelier Floral Premium</title>
  <meta name="description" content="BellaFlor - Design floral exclusivo e presentes inesquecíveis." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Pinyon+Script&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* (mesmo CSS do seu projeto — mantive por brevidade e compatibilidade) */
    :root{
      --primary:#bf6c74;--secondary:#2c3e50;--accent:#d4a373;--background:#fdfbf7;--card-bg:#fff;--text-light:#7f8c8d;--radius:6px;--shadow:0 10px 40px -10px rgba(0,0,0,0.08);
      --font-heading:"Cinzel",serif;--font-script:"Pinyon Script",cursive;--font-body:"Lato",sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{font-family:var(--font-body);background:var(--background);color:var(--secondary);-webkit-font-smoothing:antialiased;transition:opacity .45s;opacity:0}
    body.loaded{opacity:1}
    /* loader */
    .loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fffdf9;z-index:9999;gap:16px}
    .petal{font-size:3rem;color:var(--accent);animation:breathe 2s infinite}@keyframes breathe{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.05);opacity:1}}
    /* basic layout (copiado do seu estilo) */
    header.nav{position:fixed;left:0;right:0;top:0;height:72px;padding:12px 6%;display:flex;align-items:center;justify-content:space-between;z-index:1000;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,.03)}
    .brand h1{font-family:var(--font-heading);color:var(--primary);letter-spacing:2px;font-size:1.6rem} .brand span{display:block;font-family:var(--font-script);color:var(--accent);margin-top:-6px;font-size:.95rem}
    .nav-actions{display:flex;gap:18px;align-items:center}.icon-btn{background:none;border:none;font-size:1.1rem;padding:6px;cursor:pointer;position:relative;color:var(--secondary)}.icon-btn .badge{position:absolute;top:-6px;right:-6px;background:var(--primary);color:#fff;border-radius:50%;padding:3px 6px;font-size:.65rem}
    .hero{height:88vh;min-height:520px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.08));background-size:cover;background-position:center;margin-top:72px;color:#fff}
    .hero h2{font-family:var(--font-script);font-size:clamp(2rem,6vw,4.2rem);text-shadow:0 6px 18px rgba(0,0,0,.35)}
    .lead{font-family:var(--font-heading);letter-spacing:2px;text-transform:uppercase;font-size:1rem;margin-bottom:28px}
    .btn-primary{padding:14px 34px;border-radius:10px;background:var(--primary);color:#fff;border:none;font-weight:700;cursor:pointer}
    .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff}
    .cats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:36px 6%;padding:6px 0}
    .cat{background:none;border:none;padding:8px 12px;cursor:pointer;font-family:var(--font-heading);color:#999;border-bottom:3px solid transparent}
    .cat.active{color:var(--primary);border-color:var(--primary);font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:32px;padding:0 6% 80px;max-width:1600px;margin:0 auto}
    .card{background:var(--card-bg);border-radius:var(--radius);overflow:hidden;transition:transform .35s,box-shadow .35s}.card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
    .card .img{height:320px;overflow:hidden;background:#eee}.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s}.card:hover img{transform:scale(1.06)}
    .card .info{padding:14px;text-align:center}.cat-tag{font-size:.72rem;color:var(--accent);letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
    footer.site{background:#f8f8f8;padding:60px 6%;text-align:center;border-top:1px solid #eee}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:2000;opacity:0;pointer-events:none;transition:.25s}.overlay.show{opacity:1;pointer-events:all}
    .cart{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:96%;background:#fff;z-index:2050;transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column}
    .cart.open{transform:translateX(0)}.cart .header,.cart .footer{padding:20px;border-bottom:1px solid #eee}.cart .body{padding:20px;overflow:auto;flex:1}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:2100;opacity:0;pointer-events:none;transition:.25s}.modal.show{opacity:1;pointer-events:all}
    .modal-card{background:#fff;border-radius:8px;max-width:1000px;width:100%;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.25)}
    @media (max-width:820px){.modal-card{grid-template-columns:1fr}}
    .modal-img{background-size:cover;background-position:center;min-height:320px}
    .modal-content{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
    .debug-error{position:fixed;left:12px;right:12px;bottom:12px;background:#ffefef;border-left:6px solid #d9534f;color:#5a2121;padding:12px;border-radius:6px;z-index:99999;box-shadow:0 8px 30px rgba(0,0,0,.1);font-size:.9rem}
  </style>
</head>
<body>
  <div id="root">
    <div class="loader" id="loader" aria-hidden="true">
      <div class="petal"><i class="fas fa-seedling"></i></div>
      <div style="font-family:var(--font-heading);letter-spacing:3px;color:#888;font-size:.9rem">CULTIVANDO BELEZA...</div>
    </div>

    <header class="nav" role="banner" aria-label="Navegação principal">
      <div class="brand" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="cursor:pointer">
        <h1 id="store-name">BellaFlor</h1>
        <span id="store-sub">Atelier Botânico</span>
      </div>
      <div class="nav-actions" role="navigation" aria-label="Ações">
        <button class="icon-btn" id="wish-btn" aria-label="Itens salvos"><i class="far fa-heart"></i></button>
        <button class="icon-btn" id="cart-btn" aria-label="Abrir carrinho"><i class="fas fa-shopping-bag"></i><span class="badge" id="cart-count" style="display:none">0</span></button>
      </div>
    </header>

    <main>
      <section class="hero" id="hero" aria-label="Apresentação principal">
        <div>
          <p class="lead" id="hero-title">A Poesia das Flores</p>
          <h2 id="hero-name">BellaFlor</h2>
          <p class="lead" id="hero-sub" style="font-size:1rem;text-transform:none;max-width:680px;margin:12px auto 26px"></p>
          <div style="display:flex;gap:12px;justify-content:center">
            <button class="btn-primary" id="hero-cta">Ver Coleção</button>
            <a id="hero-whatsapp" class="btn-outline" href="#" style="padding:12px 20px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:#fff;border:1px solid rgba(255,255,255,.5)"><i class="fab fa-whatsapp"></i> WhatsApp</a>
          </div>
        </div>
      </section>

      <nav class="cats" id="category-bar" aria-label="Categorias"></nav>
      <section class="grid" id="products" aria-live="polite"></section>
    </main>

    <footer class="site" role="contentinfo">
      <h2 id="footer-name" style="font-family:var(--font-heading);color:var(--primary);margin-bottom:16px">BellaFlor</h2>
      <div class="social">
        <a id="link-instagram" href="#" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
        <a id="link-whats" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i></a>
        <a id="link-email" href="#"><i class="far fa-envelope"></i></a>
      </div>
      <p style="color:#aaa;font-size:.85rem">© <span id="footer-year"></span> <span id="footer-c-name">BellaFlor</span>. <span id="footer-made">Design Exclusivo</span>.</p>
    </footer>

    <div class="overlay" id="overlay" tabindex="-1" aria-hidden="true"></div>
    <aside class="cart" id="cart" aria-hidden="true" role="dialog" aria-label="Carrinho de compras">
      <div class="header" style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0;font-family:var(--font-heading)">Seu Jardim</h3>
        <button class="icon-btn" id="close-cart" aria-label="Fechar carrinho"><i class="fas fa-times"></i></button>
      </div>
      <div class="body" id="cart-body">
        <p id="cart-empty" style="color:#999;text-align:center;margin-top:40px">Sua cesta de flores está vazia no momento.</p>
      </div>
      <div class="footer">
        <div class="cart-total"><span>Subtotal</span><span id="cart-total">R$ 0,00</span></div>
        <a id="checkout-wp" href="#" target="_blank" style="display:block;padding:12px 14px;background:#25D366;color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-weight:700">Finalizar no WhatsApp <i class="fab fa-whatsapp" style="margin-left:8px"></i></a>
      </div>
    </aside>

    <div class="modal" id="modal" aria-hidden="true" role="dialog">
      <div class="modal-card" role="document">
        <div class="modal-img" id="modal-img" aria-hidden="true"></div>
        <div class="modal-content">
          <span id="modal-cat" style="text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:700"></span>
          <h2 id="modal-title" style="font-family:var(--font-heading)"></h2>
          <p id="modal-price" style="font-size:1.25rem;color:var(--primary);margin:6px 0"></p>
          <p id="modal-desc" style="color:#666;line-height:1.6"></p>
          <div style="display:flex;gap:12px;margin-top:14px">
            <button class="btn-primary" id="modal-add" style="flex:1">Adicionar à Cesta</button>
            <button class="btn-outline" id="modal-wish" style="flex:0;padding:10px 12px"><i class="far fa-heart"></i></button>
          </div>
        </div>
      </div>
    </div>

    <!-- espaço para mensagens de erro JS visíveis -->
    <div id="debug-errors" aria-live="polite"></div>
  </div>

  <script>
    (function(){
      // helper rápido
      const $ = (sel, root=document) => root.querySelector(sel);
      const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
      const formatMoney = v => Number(v).toLocaleString('pt-BR', {style:'currency',currency:'BRL'});

      // elementos
      const loader = $('#loader');
      const rootEl = document.getElementById('root');
      const hero = $('#hero');
      const productsEl = $('#products');
      const catsEl = $('#category-bar');
      const cartBtn = $('#cart-btn');
      const wishBtn = $('#wish-btn');
      const cartCountEl = $('#cart-count');
      const cartSidebar = $('#cart');
      const overlay = $('#overlay');
      const cartBody = $('#cart-body');
      const cartTotalEl = $('#cart-total');
      const cartEmpty = $('#cart-empty');
      const checkoutWp = $('#checkout-wp');
      const modal = $('#modal');
      const modalImg = $('#modal-img');
      const modalTitle = $('#modal-title');
      const modalDesc = $('#modal-desc');
      const modalPrice = $('#modal-price');
      const modalCat = $('#modal-cat');
      const modalAdd = $('#modal-add');
      const modalWish = $('#modal-wish');
      const heroTitle = $('#hero-title');
      const heroName = $('#hero-name');
      const heroSub = $('#hero-sub');
      const heroCta = $('#hero-cta');
      const heroWp = $('#hero-whatsapp');
      const debugEl = $('#debug-errors');

      // DEFAULT_CONFIG (igual ao anterior, mas reduzido aqui por brevidade)
      const DEFAULT_CONFIG = {
        meta:{version:"2.0"},
        store:{info:{name:"BellaFlor",subtitle:"Atelier Botânico",whatsapp_number:"551938279999"},links:{instagram:"https://instagram.com",email:"mailto:contato@bellaflor.com.br"}},
        theme:{colors:{primary:"#bf6c74",accent:"#d4a373",background:"#fdfbf7",card_bg:"#fff"},fonts:{heading:"'Cinzel', serif",script:"'Pinyon Script', cursive",body:"'Lato', sans-serif"},ui:{radius:"6px"}},
        texts:{hero:{title:"A Poesia das Flores",subtitle:"Arranjos autorais que traduzem sentimentos.",cta:"Ver Coleção",bg_image:"https://images.unsplash.com/photo-1563241527-300027f88ea2?auto=format&fit=crop&w=1920&q=80"},footer:{made_by:"Design Exclusivo"},cart:{title:"Seu Jardim",empty:"Sua cesta de flores está vazia no momento.",checkout:"Finalizar no WhatsApp",total:"Subtotal"},product:{currency:"R$",add_to_cart:"Adicionar à Cesta"}},
        catalog:{categories:["Todos","Buquês","Arranjos","Box Luxo","Orquídeas","Secas & Preservadas"],mock_settings:{count:24,base_price:120}}
      };

      // estado
      let CONFIG = DEFAULT_CONFIG;
      let PRODUCTS = [];
      let activeCategory = null;
      let CART = JSON.parse(localStorage.getItem('bellaCart')||'[]');
      let WISH = JSON.parse(localStorage.getItem('bellaWish')||'[]');

      // pequenas utilidades
      function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
      function showDebugError(msg){
        debugEl.innerHTML = `<div class="debug-error"><strong>Erro:</strong> ${escapeHtml(msg)}</div>`;
        console.error(msg);
      }

      // aplicar tema
      function applyTheme(){
        try{
          const t = CONFIG.theme;
          if(t && t.colors) for(const k in t.colors) document.documentElement.style.setProperty(`--${k}`, t.colors[k]);
          if(t && t.fonts){
            if(t.fonts.heading) document.documentElement.style.setProperty('--font-heading', t.fonts.heading);
            if(t.fonts.script) document.documentElement.style.setProperty('--font-script', t.fonts.script);
            if(t.fonts.body) document.documentElement.style.setProperty('--font-body', t.fonts.body);
          }
        }catch(e){ console.warn('applyTheme:', e) }
      }

      // Gerador mock (idem)
      function generateMock(count=24,basePrice=120){
        const flowers=[{name:'Rosas Colombianas',key:'rosa',priceMod:1.5},{name:'Hortênsias Azuis',key:'hydrangea',priceMod:1.2},{name:'Orquídea Phalaenopsis',key:'orchid',priceMod:2.0},{name:'Girassóis Vibrantes',key:'sunflower',priceMod:0.9},{name:'Mix do Campo',key:'wildflower',priceMod:0.8},{name:'Tulipas Holandesas',key:'tulip',priceMod:1.8},{name:'Lisianthus Premium',key:'lisianthus',priceMod:1.1},{name:'Folhagens Secas',key:'dried',priceMod:1.3}];
        const adjectives=['Imperial','Aurora','Romance','Serenidade','Majestade','Poesia','Vintage','Minimal'];
        const containers=['em Vaso de Cristal','no Kraft','na Box Aveludada','Rústico','Hand-tied'];
        const map={'rosa':['1562690868-60bbe7293e94','1518709268805-4e9042af9f23'],'hydrangea':['1508610048181-48f6704e3f36'],'orchid':['1566929341488-820845a76cb5'],'sunflower':['1470509037663-253afd7f0f51'],'tulip':['1520763185298-1b434c919102'],'wildflower':['1464698579707-353232147316'],'dried':['1533616688419-b7a58556e124']};
        return Array.from({length:count},(_,i)=>{
          const f=flowers[i%flowers.length];
          const adj=adjectives[i%adjectives.length];
          const cont=containers[i%containers.length];
          let cat='Arranjos';
          if(cont.includes('Kraft')||cont.includes('Hand-tied')) cat='Buquês';
          if(cont.includes('Box')) cat='Box Luxo';
          if(f.name.includes('Orquídea')) cat='Orquídeas';
          const price=(basePrice*f.priceMod+(Math.random()*40)).toFixed(2);
          const coll=map[f.key]||map['wildflower'];
          const image=`https://images.unsplash.com/photo-${coll[i%coll.length]}?auto=format&fit=crop&w=900&q=80`;
          return {id:`prod_${i+1}`,name:`${f.name} ${adj}`,subtitle:`${cont} • Design Exclusivo`,category:cat,price:price,image:image,description:`Uma composição artística elaborada com ${f.name} frescas e selecionadas.`};
        });
      }

      // render básico
      function renderCategories(categories){
        catsEl.innerHTML='';
        categories.forEach(cat=>{
          const btn = document.createElement('button');
          btn.className = 'cat' + (cat===activeCategory ? ' active' : '');
          btn.textContent = cat;
          btn.addEventListener('click', ()=>{ activeCategory = cat; $$('.cat').forEach(n=>n.classList.remove('active')); btn.classList.add('active'); renderProducts(); });
          catsEl.appendChild(btn);
        });
      }
      function getFiltered(){
        if(!activeCategory || activeCategory === (CONFIG.catalog.categories[0] || 'Todos')) return PRODUCTS;
        return PRODUCTS.filter(p=>p.category===activeCategory);
      }
      function renderProducts(){
        productsEl.innerHTML='';
        const list = getFiltered();
        list.forEach((p,i)=>{
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `<div class="img" role="button" tabindex="0" aria-label="Ver ${escapeHtml(p.name)}"><img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/900x600?text=Imagem'"></div><div class="info"><div class="cat-tag">${escapeHtml(p.category)}</div><h3>${escapeHtml(p.name)}</h3><div class="price">${formatMoney(p.price)}</div></div>`;
          card.querySelector('.img').addEventListener('click', ()=> openModal(p));
          card.querySelector('.img').addEventListener('keydown',(e)=>{ if(e.key==='Enter') openModal(p) });
          productsEl.appendChild(card);
        });
      }

      function openModal(prod){
        modal.currentProduct = prod;
        modalImg.style.backgroundImage = `url('${prod.image}')`;
        modalTitle.textContent = prod.name;
        modalDesc.textContent = prod.description;
        modalPrice.textContent = formatMoney(prod.price);
        modalCat.textContent = prod.category;
        updateModalWishState();
        modal.classList.add('show'); overlay.classList.add('show'); modal.setAttribute('aria-hidden','false'); overlay.setAttribute('aria-hidden','false');
        modalAdd.focus();
      }
      function closeModal(){ modal.currentProduct=null; modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true'); }
      function updateModalWishState(){ if(!modal.currentProduct) return; modalWish.innerHTML = (WISH.find(i=>i.id===modal.currentProduct.id) ? '<i class="fas fa-heart" style="color:var(--primary)"></i>' : '<i class="far fa-heart"></i>'); }

      function persistCart(){ localStorage.setItem('bellaCart', JSON.stringify(CART)); }
      function persistWish(){ localStorage.setItem('bellaWish', JSON.stringify(WISH)); }
      function addToCart(p){ CART.push(p); persistCart(); renderCart(); updateCartCount(); }
      function removeFromCart(i){ CART.splice(i,1); persistCart(); renderCart(); updateCartCount(); }
      function renderCart(){
        cartBody.innerHTML='';
        if(CART.length===0){ cartBody.appendChild(cartEmpty); cartEmpty.style.display='block'; }
        else {
          cartEmpty.style.display='none';
          CART.forEach((it,idx)=>{
            const el = document.createElement('div'); el.className='cart-item';
            el.innerHTML = `<img src="${it.image}" alt="${escapeHtml(it.name)}" onerror="this.src='https://via.placeholder.com/80x80?text=Img'"><div style="flex:1"><div style="font-weight:700">${escapeHtml(it.name)}</div><div style="color:var(--primary);font-weight:700">${formatMoney(it.price)}</div></div><button class="icon-btn" aria-label="Remover item"><i class="far fa-trash-alt"></i></button>`;
            el.querySelector('button').addEventListener('click', ()=> removeFromCart(idx));
            cartBody.appendChild(el);
          });
        }
        cartTotalEl.textContent = formatMoney(CART.reduce((a,c)=>a+Number(c.price),0));
        checkoutWp.href = buildWhatsAppLink();
      }
      function toggleCart(open){ if(open){ cartSidebar.classList.add('open'); overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false'); cartSidebar.setAttribute('aria-hidden','false'); } else { cartSidebar.classList.remove('open'); overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true'); cartSidebar.setAttribute('aria-hidden','true'); } }
      function updateCartCount(){ if(CART.length>0){ cartCountEl.style.display='inline-block'; cartCountEl.textContent=CART.length } else cartCountEl.style.display='none' }
      function toggleWish(prod){ const idx = WISH.findIndex(i=>i.id===prod.id); if(idx===-1) WISH.push(prod); else WISH.splice(idx,1); persistWish(); }

      function buildWhatsAppLink(){
        const wp = (CONFIG && CONFIG.store && CONFIG.store.info && CONFIG.store.info.whatsapp_number) ? CONFIG.store.info.whatsapp_number : '';
        let msg = `Olá, vim pelo site da *${CONFIG.store.info.name}*!%0A%0A`;
        if(CART.length===0) msg += 'Ainda não selecionei produtos.%0A';
        else { CART.forEach(i=> msg += `• ${i.name} - ${formatMoney(i.price)}%0A`); msg += `%0A*Total: ${formatMoney(CART.reduce((a,c)=>a+Number(c.price),0))}*%0A`; }
        return `https://wa.me/${wp}?text=${msg}`;
      }

      // função de merge simples
      function deepMerge(a,b){
        const out = JSON.parse(JSON.stringify(a));
        for(const k in b){
          if(b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) out[k] = deepMerge(out[k]||{}, b[k]);
          else out[k] = b[k];
        }
        return out;
      }

      // Carrega config.json — mas faz fallback automático se estiver em file: ou se fetch falhar
      async function loadConfig(){
        try {
          // se estiver abrindo via file://, não tente fetch (padrão: usar DEFAULT)
          const isFile = location.protocol === 'file:';
          if(isFile){
            console.warn('file:// detectado — usando DEFAULT_CONFIG (ignorar config.json).');
            CONFIG = DEFAULT_CONFIG;
            applyTheme(); startApp();
            return;
          }

          // tenta buscar config.json (se não existir, usamos default)
          const res = await fetch('config.json', { cache: 'no-store' });
          if(res.ok){
            const remote = await res.json();
            CONFIG = deepMerge(DEFAULT_CONFIG, remote);
            console.info('config.json carregado');
          } else {
            console.warn('config.json não encontrado -> usando DEFAULT_CONFIG');
            CONFIG = DEFAULT_CONFIG;
          }
        } catch(err){
          console.warn('Erro ao buscar config.json -> usando DEFAULT_CONFIG', err);
          CONFIG = DEFAULT_CONFIG;
        } finally {
          applyTheme();
          startApp();
        }
      }

      function startApp(){
        try{
          // preenche header/hero/footer
          heroTitle.textContent = CONFIG.texts.hero.title || '';
          heroName.textContent = CONFIG.store.info.name || '';
          heroSub.textContent = CONFIG.texts.hero.subtitle || '';
          hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.08)), url('${CONFIG.texts.hero.bg_image}')`;
          $('#footer-year').textContent = new Date().getFullYear();
          $('#footer-c-name').textContent = CONFIG.store.info.name || '';
          $('#footer-made').textContent = CONFIG.texts.footer.made_by || '';
          $('#link-instagram').href = CONFIG.store.links.instagram || '#';
          $('#link-whats').href = `https://wa.me/${CONFIG.store.info.whatsapp_number}`;
          $('#link-email').href = CONFIG.store.links.email || '#';
          heroWp.href = `https://wa.me/${CONFIG.store.info.whatsapp_number}`;
          $('#hero-whatsapp').href = `https://wa.me/${CONFIG.store.info.whatsapp_number}`;

          // produtos
          if(CONFIG.catalog.products && Array.isArray(CONFIG.catalog.products) && CONFIG.catalog.products.length>0){
            PRODUCTS = CONFIG.catalog.products.map((p,i)=>({...p,id:p.id||`prod_${i+1}`}));
          } else {
            const cnt = (CONFIG.catalog.mock_settings && CONFIG.catalog.mock_settings.count) || 24;
            const base = (CONFIG.catalog.mock_settings && CONFIG.catalog.mock_settings.base_price) || 120;
            PRODUCTS = generateMock(cnt, base);
          }

          const cats = Array.from(new Set([CONFIG.catalog.categories[0] || 'Todos', ...(CONFIG.catalog.categories || [])]));
          activeCategory = cats[0];
          renderCategories(cats);

          // eventos
          heroCta.addEventListener('click', ()=> document.getElementById('products').scrollIntoView({behavior:'smooth'}));
          cartBtn.addEventListener('click', ()=> toggleCart(true));
          wishBtn.addEventListener('click', ()=> alert(`${WISH.length} itens salvos`));
          $('#close-cart').addEventListener('click', ()=> toggleCart(false));
          overlay.addEventListener('click', ()=>{ closeModal(); toggleCart(false); });
          modalAdd.addEventListener('click', ()=>{ if(!modal.currentProduct) return; addToCart(modal.currentProduct); closeModal(); toggleCart(true); });
          modalWish.addEventListener('click', ()=>{ if(!modal.currentProduct) return; toggleWish(modal.currentProduct); updateModalWishState(); });
          document.addEventListener('keydown', (e)=> { if(e.key==='Escape'){ closeModal(); toggleCart(false); } });

          renderProducts(); renderCart(); updateCartCount();

          // tudo ok -> remover loader
          setTimeout(()=>{ if(loader){ loader.remove(); document.body.classList.add('loaded'); } }, 350);
          console.info('App inicializado com sucesso');
        } catch(err){
          // mostra erro visível para debug
          showDebugError('Erro ao inicializar a aplicação: ' + (err && err.message ? err.message : String(err)));
          console.error(err);
          // garante remoção do loader para não ficar tela preta
          if(loader){ loader.remove(); document.body.classList.add('loaded'); }
        }
      }

      // safety: captura erros globais e exibe na UI para você ver no GitHub
      window.addEventListener('error', function(evt){
        const msg = (evt && evt.message) ? evt.message : 'Erro não identificado';
        showDebugError('Erro JS: ' + msg);
        console.error(evt.error || evt);
        if(loader){ loader.remove(); document.body.classList.add('loaded'); }
      });
      window.addEventListener('unhandledrejection', function(evt){
        showDebugError('Promise rejeitada: ' + (evt.reason && evt.reason.message ? evt.reason.message : String(evt.reason)));
        console.error(evt);
        if(loader){ loader.remove(); document.body.classList.add('loaded'); }
      });

      // inicializa
      loadConfig();

      // expor algumas coisas para console dev
      window.Bella = { get config(){return CONFIG}, get products(){return PRODUCTS}, addToCart: (p)=>addToCart(p) };
    })();
  </script>
</body>
</html>
